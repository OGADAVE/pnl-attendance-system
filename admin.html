<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#020617" />
<style>

:root {
  --bg:      #020617;
  --card:    #1e293b;
  --card2:   #0f172a;
  --border:  #334155;
  --text:    #ffffff;
  --muted:   #94a3b8;
  --green:   #22c55e;
  --blue:    #3b82f6;
  --red:     #ef4444;
  --orange:  #f97316;
  --yellow:  #facc15;
  --purple:  #6366f1;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 20px;
}

/* ── HEADER ─────────────────────────── */

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  flex-wrap: wrap;
}

.header-left h1 { font-size: 28px; }
.header-left p  { margin-top: 5px; color: var(--muted); }

.live-time         { text-align: center; }
.live-time h2      { font-size: 42px; color: var(--green); letter-spacing: 2px; }
.live-time p       { margin-top: 6px; color: var(--muted); }

.header-actions    { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }

/* ── BUTTONS ────────────────────────── */

button {
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  cursor: pointer;
  color: white;
  font-weight: 600;
  font-size: 14px;
  transition: opacity .2s, transform .1s;
}
button:hover:not(:disabled)  { opacity: .9; }
button:active:not(:disabled) { transform: scale(.97); }
button:disabled               { opacity: .5; cursor: not-allowed; }

.add      { background: var(--green); }
.export   { background: #0ea5e9; }
.logout   { background: var(--red); }
.apply    { background: var(--purple); }
.override { background: var(--orange); font-size: 13px; padding: 8px 14px; }
.override.done { background: var(--card2); color: var(--muted); cursor: not-allowed; }

/* ── STATS ──────────────────────────── */

.stats-grid {
  margin-top: 25px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

.stat-card             { background: var(--card); padding: 20px; border-radius: 14px; }
.stat-card h3          { font-size: 14px; color: var(--muted); }
.stat-card p           { margin-top: 10px; font-size: 28px; font-weight: bold; }
.stat-card p.green     { color: var(--green); }
.stat-card p.yellow    { color: var(--yellow); }
.stat-card p.red       { color: var(--red); }

/* ── CONTROLS ───────────────────────── */

.controls {
  margin-top: 25px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}

.controls input,
.controls select {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: var(--card);
  color: white;
  outline: none;
  font-size: 14px;
}

.controls select option { background: var(--card2); }

/* ── TABLE ──────────────────────────── */

.table-card {
  margin-top: 25px;
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.table-wrapper { overflow: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1100px;
}

th, td {
  padding: 14px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  white-space: nowrap;
}

th {
  background: var(--card2);
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
  position: sticky;
  top: 0;
  z-index: 1;
}

tbody tr:hover  { background: rgba(255,255,255,.03); }
tbody tr:last-child td { border-bottom: none; }

/* Status colours */
.status-present { color: var(--green);  font-weight: bold; text-transform: capitalize; }
.status-late    { color: var(--yellow); font-weight: bold; text-transform: capitalize; }
.status-absent  { color: var(--red);    font-weight: bold; text-transform: capitalize; }

.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--card2);
  font-size: 12px;
  text-transform: capitalize;
}

.selfie {
  width: 46px;
  height: 46px;
  object-fit: cover;
  border-radius: 8px;
  display: block;
}

.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.empty {
  text-align: center;
  padding: 48px;
  color: var(--muted);
  font-size: 15px;
}

/* ── MODAL ──────────────────────────── */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 999;
}

.modal.open { display: flex; }

.modal-content {
  width: 100%;
  max-width: 460px;
  background: var(--card);
  border-radius: 16px;
  padding: 28px;
}

.modal-content h2        { margin-bottom: 20px; font-size: 20px; }
.modal-content label     { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
.modal-content label:first-of-type { margin-top: 0; }
.modal-content input     { width: 100%; padding: 13px; border: none; border-radius: 10px; background: var(--card2); color: white; outline: none; font-size: 14px; }

.modal-actions           { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions button    { flex: 1; }

.close-btn  { background: #475569; }
.create-btn { background: var(--green); }

/* ── TOAST ──────────────────────────── */

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: var(--card);
  border-left: 4px solid var(--green);
  padding: 14px 18px;
  border-radius: 12px;
  min-width: 260px;
  font-size: 14px;
  z-index: 9999;
  transform: translateY(80px);
  opacity: 0;
  transition: transform .3s ease, opacity .3s ease;
  pointer-events: none;
}

.toast.show         { transform: translateY(0); opacity: 1; }
.toast.error        { border-left-color: var(--red); }

/* ── RESPONSIVE ─────────────────────── */

@media (max-width: 768px) {
  body              { padding: 15px; }
  .live-time h2     { font-size: 30px; }
  .header           { flex-direction: column; }
}

</style>
</head>
<body>

<!-- ══════════════════════════════════════
     HEADER
════════════════════════════════════════ -->
<div class="header">

  <div class="header-left">
    <h1>Admin Dashboard</h1>
    <p id="adminName">Welcome back</p>
  </div>

  <div class="live-time">
    <h2 id="liveClock">00:00:00</h2>
    <p  id="liveDate">Loading date…</p>
  </div>

  <div class="header-actions">
    <button class="add"    id="addStaffBtn">+ Add Staff</button>
    <button class="export" id="exportBtn">Export CSV</button>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>

</div>

<!-- ══════════════════════════════════════
     STATS
════════════════════════════════════════ -->
<div class="stats-grid">
  <div class="stat-card">
    <h3>Total Staff</h3>
    <p id="totalStaff">0</p>
  </div>
  <div class="stat-card">
    <h3>Present</h3>
    <p id="presentCount" class="green">0</p>
  </div>
  <div class="stat-card">
    <h3>Late</h3>
    <p id="lateCount" class="yellow">0</p>
  </div>
  <div class="stat-card">
    <h3>Absent</h3>
    <p id="absentCount" class="red">0</p>
  </div>
</div>

<!-- ══════════════════════════════════════
     CONTROLS
════════════════════════════════════════ -->
<div class="controls">
  <input type="date"   id="dateFilter" />
  <input type="text"   id="search"       placeholder="Search by name or email" />
  <select id="statusFilter">
    <option value="all">All Status</option>
    <option value="present">Present</option>
    <option value="late">Late</option>
    <option value="absent">Absent</option>
  </select>
  <button class="apply" id="applyBtn">Apply Filters</button>
</div>

<!-- ══════════════════════════════════════
     TABLE
════════════════════════════════════════ -->
<div class="table-card">
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Staff ID</th>
          <th>Status</th>
          <th>Method</th>
          <th>Check-In</th>
          <th>Check-Out</th>
          <th>Selfie</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="9" class="empty">Loading attendance…</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ══════════════════════════════════════
     MODAL — Create Staff
════════════════════════════════════════ -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">

    <h2 id="modalTitle">Create Staff Account</h2>

    <label for="inputName">Full Name</label>
    <input type="text"     id="inputName"       placeholder="e.g. Jane Doe" autocomplete="off" />

    <label for="inputEmail">Email Address</label>
    <input type="email"    id="inputEmail"      placeholder="e.g. jane@company.com" autocomplete="off" />

    <label for="inputStaffId">Staff ID</label>
    <input type="text"     id="inputStaffId"    placeholder="e.g. PNL-001" autocomplete="off" />

    <label for="inputDepartment">Department</label>
    <input type="text"     id="inputDepartment" placeholder="e.g. Engineering" autocomplete="off" />

    <label for="inputPassword">Password</label>
    <input type="password" id="inputPassword"   placeholder="Min. 6 characters" autocomplete="new-password" />

    <div class="modal-actions">
      <button class="create-btn" id="createBtn">Create Staff</button>
      <button class="close-btn"  id="closeBtn">Cancel</button>
    </div>

  </div>
</div>

<!-- ══════════════════════════════════════
     TOAST
════════════════════════════════════════ -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script type="module">

import { auth, db }              from "./js/firebase.js";
import { protectPage, logoutUser } from "./js/auth.js";

import {
  collection, onSnapshot,
  doc, setDoc, getDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// ══════════════════════════════════════
// DOM REFS
// ══════════════════════════════════════

const $ = id => document.getElementById(id);

const tableBody    = $("tableBody");
const adminName    = $("adminName");
const totalStaff   = $("totalStaff");
const presentCount = $("presentCount");
const lateCount    = $("lateCount");
const absentCount  = $("absentCount");
const addStaffBtn  = $("addStaffBtn");
const modal        = $("modal");
const closeBtn     = $("closeBtn");
const createBtn    = $("createBtn");
const logoutBtn    = $("logoutBtn");
const applyBtn     = $("applyBtn");
const exportBtn    = $("exportBtn");
const toastEl      = $("toast");
const dateFilter   = $("dateFilter");
const searchInput  = $("search");
const statusFilter = $("statusFilter");


// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════

let users      = [];   // from Firestore "users" collection
let attendance = [];   // from Firestore "attendance" collection


// ══════════════════════════════════════
// HELPERS
// ══════════════════════════════════════

/**
 * Returns today's date in YYYY-MM-DD using LOCAL time,
 * avoiding the UTC-drift bug from toISOString().
 */
function getToday() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm   = String(d.getMonth() + 1).padStart(2, "0");
  const dd   = String(d.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

/**
 * Safely converts any value to a trimmed string — never returns undefined.
 */
function str(value) {
  if (value === null || value === undefined) return "";
  return String(value).trim();
}

/**
 * Format a Firestore Timestamp or ISO string to "HH:MM AM/PM".
 * Returns "-" for anything that can't be parsed.
 */
function formatTime(ts) {
  if (!ts) return "-";
  try {
    // Pending serverTimestamp() has a _methodName property — treat as null
    if (ts._methodName === "serverTimestamp") return "-";

    const date = typeof ts.toDate === "function" ? ts.toDate() : new Date(ts);
    if (isNaN(date.getTime())) return "-";

    return date.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
  } catch {
    return "-";
  }
}

/**
 * Look up an attendance record for a given userId and date.
 * Falls back to today if no date is specified.
 */
function getAttendanceRecord(userId, selectedDate) {
  const targetDate = selectedDate || getToday();
  return attendance.find(r => r.userId === userId && r.date === targetDate) || null;
}

/**
 * Escape HTML to prevent XSS when rendering user data.
 */
function esc(value) {
  return str(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}


// ══════════════════════════════════════
// TOAST
// ══════════════════════════════════════

let _toastTimer = null;

function showToast(message, type = "success") {
  toastEl.textContent = message;
  toastEl.className   = `toast ${type}`;

  // Force reflow so transition fires even if already showing
  void toastEl.offsetHeight;
  toastEl.classList.add("show");

  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => {
    toastEl.classList.remove("show");
  }, 3500);
}


// ══════════════════════════════════════
// DEBOUNCED RENDER
// ══════════════════════════════════════

/**
 * Both onSnapshot listeners call scheduleRender() instead of render()
 * directly. This collapses rapid back-to-back snapshot fires (common on
 * page load and after writes) into a single render, preventing flicker.
 */
let _renderTimer = null;

function scheduleRender() {
  clearTimeout(_renderTimer);
  _renderTimer = setTimeout(render, 60);
}


// ══════════════════════════════════════
// PAGE PROTECTION
// ══════════════════════════════════════

protectPage("admin", (user, userData) => {
  adminName.textContent = `Welcome, ${str(userData.name) || "Admin"}`;
  initializeRealtime();
});


// ══════════════════════════════════════
// REALTIME LISTENERS
// ══════════════════════════════════════

function initializeRealtime() {

  // Users collection
  onSnapshot(
    collection(db, "users"),
    snapshot => {
      users = snapshot.docs.map(docSnap => ({
        ...docSnap.data(),          // spread first so our explicit fields win
        id:     docSnap.id,
        userId: str(docSnap.data().userId) || docSnap.id,
      }));
      scheduleRender();
    },
    error => {
      console.error("Users snapshot error:", error);
      showToast("Failed to load users", "error");
    }
  );

  // Attendance collection
  onSnapshot(
    collection(db, "attendance"),
    snapshot => {
      attendance = snapshot.docs.map(docSnap => ({
        ...docSnap.data(),
        id: docSnap.id,
      }));
      scheduleRender();
    },
    error => {
      console.error("Attendance snapshot error:", error);
      showToast("Failed to load attendance", "error");
    }
  );
}


// ══════════════════════════════════════
// RENDER
// ══════════════════════════════════════

function render() {
  const search       = searchInput.value.toLowerCase().trim();
  const statusF      = statusFilter.value;
  const selectedDate = dateFilter.value;        // YYYY-MM-DD or ""

  // Only show staff-role users
  const staffUsers = users.filter(u =>
    u && typeof u === "object" && u.role === "staff"
  );

  let present = 0, late = 0, absent = 0;

  // ── Build rows ────────────────────────
  // Collect HTML strings in an array, then set innerHTML ONCE.
  // Using innerHTML += inside a loop destroys and recreates existing
  // DOM nodes on every iteration — the root cause of the "table clears" bug.

  const rows = [];

  staffUsers.forEach(user => {
    const userId = str(user.userId) || str(user.id);
    const name   = str(user.name);
    const email  = str(user.email);
    const staffId = str(user.staffId);

    // Attendance record for this user on the target date
    const record   = getAttendanceRecord(userId, selectedDate);

    const status   = str(record?.status)       || "absent";
    const method   = str(record?.method)       || "-";
    const checkIn  = formatTime(record?.checkInTime);
    const checkOut = formatTime(record?.checkOutTime);
    const selfie   = str(record?.selfieUrl);

    // Stats (counts all staff regardless of search/status filter)
    if      (status === "present") present++;
    else if (status === "late")    late++;
    else                           absent++;

    // Search filter
    if (search &&
        !name.toLowerCase().includes(search) &&
        !email.toLowerCase().includes(search)
    ) return;

    // Status filter
    if (statusF !== "all" && status !== statusF) return;

    // Button state
    const checkedIn  = !!record?.checkInTime && record.checkInTime._methodName !== "serverTimestamp";
    const checkedOut = !!record?.checkOutTime && record.checkOutTime._methodName !== "serverTimestamp";

    rows.push(`
      <tr>
        <td>${esc(name)  || "<span style='color:var(--muted)'>—</span>"}</td>
        <td>${esc(email) || "<span style='color:var(--muted)'>—</span>"}</td>
        <td><span class="badge">${esc(staffId) || "—"}</span></td>
        <td><span class="status-${esc(status)}">${esc(status)}</span></td>
        <td><span class="badge">${esc(method)}</span></td>
        <td>${esc(checkIn)}</td>
        <td>${esc(checkOut)}</td>
        <td>${selfie
          ? `<img src="${esc(selfie)}" class="selfie" alt="Selfie" loading="lazy" />`
          : "<span style='color:var(--muted)'>—</span>"
        }</td>
        <td>
          <div class="actions">
            <button
              class="override${checkedIn ? " done" : ""}"
              onclick="overrideCheckIn('${esc(userId)}')"
              ${checkedIn ? "disabled" : ""}
            >${checkedIn ? "Checked In ✓" : "Check In"}</button>

            <button
              class="override${checkedOut ? " done" : ""}"
              onclick="overrideCheckOut('${esc(userId)}')"
              ${!checkedIn || checkedOut ? "disabled" : ""}
            >${checkedOut ? "Checked Out ✓" : "Check Out"}</button>
          </div>
        </td>
      </tr>
    `);
  });

  // ── Commit to DOM (single write) ──────
  if (rows.length === 0) {
    tableBody.innerHTML = `
      <tr>
        <td colspan="9" class="empty">No attendance records found</td>
      </tr>`;
  } else {
    tableBody.innerHTML = rows.join("");
  }

  // ── Update stats ──────────────────────
  totalStaff.textContent   = staffUsers.length;
  presentCount.textContent = present;
  lateCount.textContent    = late;
  absentCount.textContent  = absent;
}


// ══════════════════════════════════════
// MODAL
// ══════════════════════════════════════

function openModal() {
  modal.classList.add("open");
  $("inputName").focus();
}

function closeModal() {
  modal.classList.remove("open");
  // Clear inputs
  ["inputName","inputEmail","inputStaffId","inputDepartment","inputPassword"]
    .forEach(id => { $(id).value = ""; });
}

addStaffBtn.addEventListener("click", openModal);
closeBtn.addEventListener("click", closeModal);

// Close on backdrop click
modal.addEventListener("click", e => {
  if (e.target === modal) closeModal();
});

// Close on Escape key
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
});


// ══════════════════════════════════════
// CREATE STAFF
// ══════════════════════════════════════

createBtn.addEventListener("click", async () => {
  const name       = str($("inputName").value);
  const email      = str($("inputEmail").value);
  const staffId    = str($("inputStaffId").value);
  const department = str($("inputDepartment").value);
  const password   = str($("inputPassword").value);

  if (!name || !email || !staffId || !password) {
    showToast("All fields except Department are required", "error");
    return;
  }

  if (password.length < 6) {
    showToast("Password must be at least 6 characters", "error");
    return;
  }

  createBtn.disabled = true;
  createBtn.textContent = "Creating…";

  try {
    const credential = await createUserWithEmailAndPassword(auth, email, password);

    await setDoc(doc(db, "users", credential.user.uid), {
      userId:     credential.user.uid,
      name,
      email,
      staffId,
      department,
      role:       "staff",
      isActive:   true,
      createdAt:  serverTimestamp(),
    });

    showToast("Staff account created successfully ✓");
    closeModal();

  } catch (error) {
    console.error("Create staff error:", error);
    showToast(error.message || "Failed to create staff", "error");
  } finally {
    createBtn.disabled = false;
    createBtn.textContent = "Create Staff";
  }
});


// ══════════════════════════════════════
// OVERRIDE CHECK-IN
// ══════════════════════════════════════

window.overrideCheckIn = async function (userId) {
  const today = getToday();

  const user = users.find(u => (str(u.userId) || str(u.id)) === userId);
  if (!user) { showToast("User not found", "error"); return; }

  try {
    await setDoc(
      doc(db, "attendance", `${userId}_${today}`),
      {
        userId,
        name:        str(user.name),
        email:       str(user.email),
        staffId:     str(user.staffId),
        department:  str(user.department),
        date:        today,
        status:      "present",
        method:      "manual",
        overridden:  true,
        checkInTime: serverTimestamp(),
      },
      { merge: true }
    );
    showToast(`${str(user.name) || "Staff"} checked in ✓`);
  } catch (error) {
    console.error("Check-in error:", error);
    showToast(error.message || "Check-in failed", "error");
  }
};


// ══════════════════════════════════════
// OVERRIDE CHECK-OUT
// ══════════════════════════════════════

window.overrideCheckOut = async function (userId) {
  const today = getToday();
  const ref   = doc(db, "attendance", `${userId}_${today}`);

  try {
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      showToast("No check-in record found for today", "error");
      return;
    }

    await setDoc(ref, {
      checkOutTime: serverTimestamp(),
      overridden:   true,
    }, { merge: true });

    const user = users.find(u => (str(u.userId) || str(u.id)) === userId);
    showToast(`${str(user?.name) || "Staff"} checked out ✓`);
  } catch (error) {
    console.error("Check-out error:", error);
    showToast(error.message || "Check-out failed", "error");
  }
};


// ══════════════════════════════════════
// EXPORT CSV
// ══════════════════════════════════════

exportBtn.addEventListener("click", () => {
  const rows = [["Name","Email","Staff ID","Status","Method","Check-In","Check-Out"]];

  document.querySelectorAll("tbody tr").forEach(row => {
    const cols = row.querySelectorAll("td");
    if (cols.length < 7) return;
    rows.push(
      Array.from(cols)
        .slice(0, 7)
        .map(col => `"${col.innerText.replace(/"/g, '""').trim()}"`)
    );
  });

  const csv  = rows.map(r => r.join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement("a"), {
    href:     url,
    download: `attendance-${getToday()}.csv`,
  });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast("CSV exported ✓");
});

// LIVE CLOCK
// ══════════════════════════════════════

const liveClock = $("liveClock");
const liveDate  = $("liveDate");

function updateClock() {
  const now = new Date();
  liveClock.textContent = now.toLocaleTimeString("en-US", {
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
  liveDate.textContent = now.toLocaleDateString("en-US", {
    weekday: "long", year: "numeric", month: "long", day: "numeric",
  });
}

updateClock();
setInterval(updateClock, 1000);
